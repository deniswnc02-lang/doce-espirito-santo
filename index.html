<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <meta
    name="theme-color"
    content="#080907"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="black-translucent"
  >

  <meta
    name="apple-mobile-web-app-title"
    content="Doce Espírito Santo"
  >

  <meta
    name="description"
    content="Doce Espírito Santo — Um Amigo Íntimo. Uma jornada de 365 dias de intimidade, presença, Palavra e comunhão com o Doce Espírito Santo."
  >

  <meta
    name="mobile-web-app-capable"
    content="yes"
  >

  <title>
    Doce Espírito Santo — Um Amigo Íntimo
  </title>

  <!-- =====================================================
       PWA
       ===================================================== -->

  <link
    rel="manifest"
    href="manifest.json"
  >

  <!-- =====================================================
       ÍCONE
       ===================================================== -->

  <link
    rel="icon"
    type="image/svg+xml"
    href="icon.svg"
  >

  <link
    rel="apple-touch-icon"
    href="icon.svg"
  >

  <!-- =====================================================
       FONTES
       ===================================================== -->

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- =====================================================
       ESTILOS
       ===================================================== -->

  <link
    rel="stylesheet"
    href="styles.css"
  >

  <style>
    /*
     * Tela inicial enquanto o aplicativo carrega.
     * O app.js assume o controle depois.
     */

    #app-loading {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        radial-gradient(
          circle at 50% 35%,
          rgba(201,164,90,.12),
          transparent 35%
        ),
        #080907;

      transition:
        opacity .4s ease,
        visibility .4s ease;
    }

    #app-loading.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .loading-inner {
      text-align: center;
      padding: 30px;
    }

    .loading-logo {
      width: 72px;
      height: 72px;

      margin: 0 auto 22px;

      object-fit: contain;

      filter:
        drop-shadow(
          0 0 25px rgba(201,164,90,.18)
        );
    }

    .loading-title {
      color: #f1dfb2;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;
      font-weight: 400;

      letter-spacing: -.02em;
    }

    .loading-subtitle {
      margin-top: 8px;

      color: #8f8a80;

      font-size: 11px;

      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .loading-line {
      width: 80px;
      height: 2px;

      margin: 24px auto 0;

      overflow: hidden;

      background: rgba(255,255,255,.08);

      border-radius: 999px;
    }

    .loading-line::after {
      content: "";

      display: block;

      width: 40%;
      height: 100%;

      background: #c9a45a;

      animation:
        loading 1.2s ease-in-out infinite;
    }

    @keyframes loading {
      0% {
        transform: translateX(-120%);
      }

      50% {
        transform: translateX(180%);
      }

      100% {
        transform: translateX(180%);
      }
    }
  </style>
</head>

<body>

  <!-- =====================================================
       LOADING
       ===================================================== -->

  <div id="app-loading">

    <div class="loading-inner">

      <img
        class="loading-logo"
        src="icon.svg"
        alt="Doce Espírito Santo"
      >

      <div class="loading-title">
        Doce Espírito Santo
      </div>

      <div class="loading-subtitle">
        Um Amigo Íntimo
      </div>

      <div class="loading-line"></div>

    </div>

  </div>


  <!-- =====================================================
       APLICAÇÃO
       O app.js constrói a interface principal aqui.
       ===================================================== -->

  <main id="app">
  </main>


  <!-- =====================================================
       FALLBACK SEM JAVASCRIPT
       ===================================================== -->

  <noscript>

    <div
      style="
        min-height:100vh;
        display:flex;
        align-items:center;
        justify-content:center;
        padding:30px;
        background:#080907;
        color:#f5f0e6;
        text-align:center;
        font-family:Arial,sans-serif;
      "
    >

      <div>

        <h1
          style="
            font-family:Georgia,serif;
            font-weight:400;
            margin-bottom:12px;
          "
        >
          Doce Espírito Santo
        </h1>

        <p
          style="
            color:#aaa49a;
            line-height:1.6;
          "
        >
          Este aplicativo precisa do JavaScript
          ativado para funcionar.
        </p>

      </div>

    </div>

  </noscript>


  <!-- =====================================================
       JAVASCRIPT PRINCIPAL
       ===================================================== -->

  <script
    src="app.js"
    defer
  ></script>


  <!-- =====================================================
       SERVICE WORKER / PWA
       ===================================================== -->

  <script>
    /*
     * Registra o Service Worker somente quando
     * o navegador oferecer suporte.
     */

    if ("serviceWorker" in navigator) {

      window.addEventListener("load", function () {

        navigator.serviceWorker
          .register("sw.js")
          .catch(function (error) {

            console.warn(
              "Service Worker não pôde ser registrado:",
              error
            );

          });

      });

    }


    /*
     * Remove a tela de carregamento depois que
     * a aplicação terminar de carregar.
     */

    window.addEventListener("load", function () {

      setTimeout(function () {

        const loading =
          document.getElementById("app-loading");

        if (loading) {
          loading.classList.add("hidden");
        }

      }, 350);

    });

  </script>

</body>
</html>
