<style>

/* =========================================================
   DOCE ESPÍRITO SANTO
   FUTURISTIC / LIQUID GLASS DESIGN
   ========================================================= */

:root {

  --bg:
    #07080b;

  --bg-soft:
    #0d0e12;

  --glass:
    rgba(255,255,255,.075);

  --glass-strong:
    rgba(255,255,255,.115);

  --glass-dark:
    rgba(10,10,13,.58);

  --border:
    rgba(255,255,255,.16);

  --border-soft:
    rgba(255,255,255,.09);

  --white:
    #f8f4ef;

  --muted:
    rgba(248,244,239,.68);

  --muted-2:
    rgba(248,244,239,.44);

  --gold:
    #f4d39a;

  --gold-strong:
    #ffc486;

  --peach:
    #f4a982;

  --peach-light:
    #ffd0ae;

  --orange:
    #e9966f;

  --shadow:
    rgba(0,0,0,.45);

  --radius-xl:
    34px;

  --radius-lg:
    27px;

  --radius-md:
    21px;

  --radius-sm:
    16px;

  --nav-height:
    78px;

  --safe-bottom:
    env(safe-area-inset-bottom);

  --safe-top:
    env(safe-area-inset-top);
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html {
  background: var(--bg);
  scroll-behavior: smooth;
}

body {

  margin: 0;

  min-height: 100dvh;

  background:
    radial-gradient(
      circle at 50% -20%,
      rgba(244,169,130,.13),
      transparent 42%
    ),
    var(--bg);

  color: var(--white);

  font-family:
    "DM Sans",
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  overflow-x: hidden;

  -webkit-font-smoothing: antialiased;
}


/* =========================================================
   APP SHELL
   ========================================================= */

#app {

  position: relative;

  min-height: 100dvh;

  overflow-x: hidden;
}


/* =========================================================
   ANIMATED ENVIRONMENT
   ========================================================= */

.ambient {

  position: fixed;

  inset: 0;

  z-index: -20;

  overflow: hidden;

  pointer-events: none;

  background:
    radial-gradient(
      circle at 50% 0%,
      rgba(244,169,130,.10),
      transparent 35%
    ),
    #07080b;
}


.ambient::before {

  content: "";

  position: absolute;

  width: 150vw;
  height: 65vh;

  left: -25vw;
  top: 8vh;

  background:

    radial-gradient(
      ellipse at center,
      rgba(244,169,130,.18),
      transparent 42%
    );

  filter:
    blur(55px);

  animation:
    ambientPulse 11s ease-in-out infinite alternate;
}


.ambient::after {

  content: "";

  position: absolute;

  width: 120vw;
  height: 80vh;

  right: -45vw;
  bottom: -20vh;

  background:

    radial-gradient(
      ellipse at center,
      rgba(210,145,108,.12),
      transparent 48%
    );

  filter:
    blur(70px);

  animation:
    ambientDrift 17s ease-in-out infinite alternate;
}


/* =========================================================
   LIQUID WAVES
   ========================================================= */

.wave-field {

  position: fixed;

  width: 150%;
  height: 55vh;

  left: -25%;

  bottom: -8vh;

  z-index: -10;

  pointer-events: none;

  opacity: .48;

  transform:
    rotate(-4deg);
}


.wave {

  position: absolute;

  width: 100%;
  height: 150px;

  border-top:
    1px solid rgba(247,190,155,.24);

  border-radius:
    50%;

  filter:
    blur(.2px);

  animation:
    waveMove 13s ease-in-out infinite;
}


.wave:nth-child(1) {

  top: 0;

  transform:
    scaleX(1.2)
    rotate(3deg);

  animation-duration: 14s;
}


.wave:nth-child(2) {

  top: 45px;

  transform:
    scaleX(1.15)
    rotate(-2deg);

  opacity: .75;

  animation-duration: 17s;

  animation-delay: -4s;
}


.wave:nth-child(3) {

  top: 90px;

  transform:
    scaleX(1.3)
    rotate(2deg);

  opacity: .48;

  animation-duration: 20s;

  animation-delay: -8s;
}


.wave:nth-child(4) {

  top: 140px;

  transform:
    scaleX(1.1)
    rotate(-3deg);

  opacity: .30;

  animation-duration: 18s;

  animation-delay: -3s;
}


/* =========================================================
   OPTIONAL REAL VIDEO BACKGROUND
   ========================================================= */

.background-video {

  position: fixed;

  inset: 0;

  width: 100%;
  height: 100%;

  object-fit: cover;

  z-index: -30;

  opacity: .18;

  mix-blend-mode:
    screen;

  pointer-events: none;

  filter:
    saturate(.9)
    contrast(1.1);

}


/* =========================================================
   TOP BAR
   ========================================================= */

.topbar {

  position: sticky;

  top: 0;

  z-index: 50;

  padding:
    calc(12px + var(--safe-top))
    18px
    12px;

  background:
    linear-gradient(
      to bottom,
      rgba(7,8,11,.82),
      rgba(7,8,11,.42),
      transparent
    );

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);
}


.topbar-inner {

  display:
    flex;

  align-items:
    center;

  justify-content:
    space-between;

  max-width:
    760px;

  margin:
    0 auto;
}


.brand {

  display:
    flex;

  align-items:
    center;

  gap:
    12px;

  min-width: 0;
}


.brand-mark {

  width: 43px;
  height: 43px;

  border-radius: 15px;

  display:
    grid;

  place-items:
    center;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.14),
      rgba(255,255,255,.035)

  border:
    1px solid rgba(255,255,255,.16);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.14),
    0 10px 35px rgba(0,0,0,.24);

  color:
    var(--gold);

  font-size:
    18px;

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);
}


.brand-text {

  min-width: 0;
}


.brand-title {

  font-size:
    15px;

  font-weight:
    600;

  letter-spacing:
    .01em;

  white-space:
    nowrap;
}


.brand-subtitle {

  margin-top:
    2px;

  font-size:
    10px;

  letter-spacing:
    .18em;

  text-transform:
    uppercase;

  color:
    var(--muted-2);

  white-space:
    nowrap;
}


.top-action {

  width: 43px;
  height: 43px;

  border-radius: 50%;

  display:
    grid;

  place-items:
    center;

  border:
    1px solid var(--border);

  background:
    rgba(255,255,255,.065);

  color:
    var(--white);

  backdrop-filter:
    blur(18px);

  -webkit-backdrop-filter:
    blur(18px);

  cursor:
    pointer;

  transition:
    transform .25s ease,
    background .25s ease;
}


.top-action:active {

  transform:
    scale(.92);
}


/* =========================================================
   MAIN
   ========================================================= */

main {

  width:
    min(100%, 760px);

  margin:
    0 auto;

  padding:
    8px 18px
    calc(
      var(--nav-height)
      + var(--safe-bottom)
      + 45px

}


/* =========================================================
   HERO
   ========================================================= */

.hero {

  position:
    relative;

  min-height:
    440px;

  border-radius:
    var(--radius-xl);

  overflow:
    hidden;

  border:
    1px solid rgba(255,255,255,.20);

.hero::before {

.hero-content {

/* =========================================================

/* =========================================================

   ========================================================= */

.progress-card {

  margin-top:

  padding:

  border-radius:
    var(--radius-lg);

  background:
    rgba(255,255,255,.055);

  border:

  backdrop-filter:
    blur(20px);

  -webkit-backdrop-filter:
    blur(20px);

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.08);
}


.progress-top {

  display:

}

.progress-number {

}

}


.progress-fill {

    100%;

  width:

      90deg,

      var(--gold)

  box-shadow:
    0 0 20px rgba(244,169,130,.25);

  transition:
    width .7s cubic-bezier(.2,.8,.2,1);
}

   SECTION

.section {

.section-kicker {

.section-title {

  line-height:

  letter-spacing:
    -.03em;
}

      rgba(255,255,255,.11),
      rgba(255,255,255,.035)

    contrast(1.08);

.today-overlay {

      rgba(4,5,7,.92)

}


.today-content {

    relative;

  min-height:
    260px;

  padding:
    26px;

  display:

<script>

/* =========================================================
   DOCE ESPÍRITO SANTO
   INDEX CONTROLLER
   ========================================================= */

(function () {

  "use strict";


  /* -------------------------------------------------------
     ESTADO LOCAL
  ------------------------------------------------------- */

  let currentRoute =
    "home";

  let currentDay =
    1;

  let devotionals =
    [];

  let currentDevotional =
    null;


  /* -------------------------------------------------------
     REFERÊNCIAS
  ------------------------------------------------------- */

  const main =
    document.getElementById("mainContent");

  const loading =
    document.getElementById("loadingScreen");

  const toast =
    document.getElementById("toast");

  const backgroundVideo =
    document.getElementById("backgroundVideo");


  /* -------------------------------------------------------
     HELPERS
  ------------------------------------------------------- */

  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }


  function showToast(message) {

    toast.textContent =
      message;

    toast.classList.add("show");

    clearTimeout(
      window.__toastTimer
    );

    window.__toastTimer =
      setTimeout(() => {

        toast.classList.remove("show");

      }, 2300);
  }


  function getAPI() {

    return window.DoceEspiritoSanto || null;
  }


  function getState() {

    const api =
      getAPI();

    if (api && api.state) {
      return api.state;
    }

    return {
      currentDay: 1,
      completedDays: [],
      favorites: [],
      journal: {}
    };
  }


  function getProgress() {

    const state =
      getState();

    const completed =
      Array.isArray(state.completedDays)
        ? state.completedDays.length
        : 0;

    return Math.min(
      365,
      completed
    );
  }


  function getDay() {

    const api =
      getAPI();

    const state =
      getState();

    const day =
      state.currentDay || currentDay || 1;

    if (api && typeof api.getDevotional === "function") {

      return api.getDevotional(day);

    }

    return devotionals.find(
      item =>
        Number(item.day) === Number(day)
    );
  }


  function imageForDay(day) {

    const images = [

      "https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=1200&q=85",

      "https://images.unsplash.com/photo-1507692049790-de58290a4334?auto=format&fit=crop&w=1200&q=85",

      "https://images.unsplash.com/photo-1500534314209-a25ddb2bd429?auto=format&fit=crop&w=1200&q=85",

      "https://images.unsplash.com/photo-1504052434569-70ad5836ab65?auto=format&fit=crop&w=1200&q=85",

      "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1200&q=85",

      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1200&q=85"

    ];

    return images[
      (Number(day || 1) - 1)
      % images.length
    ];
  }


  /* -------------------------------------------------------
     HOME
  ------------------------------------------------------- */

  function renderHome() {

    const progress =
      getProgress();

    const day =
      getDay();

    const dayNumber =
      day?.day || getState().currentDay || 1;

    const title =
      day?.title ||
      "A presença que já está aqui";

    const reference =
      day?.reference ||
      day?.bible ||
      "João 14:16–17";


    main.innerHTML = `

      <div class="view">

        <section class="hero">

          <div class="hero-content">

            <div class="eyebrow">
              SUA JORNADA
            </div>

            <h1>
              Percebê-lo.<br>
              Ele já está aqui.
            </h1>

            <p class="hero-copy">
              Uma caminhada de
              <strong>365 dias</strong>
              para desenvolver presença,
              oração, jejum, Palavra e vivência
              com o <strong>Doce Espírito Santo</strong>.
            </p>

            <button
              class="primary-button"
              data-action="continue"
            >
              CONTINUAR JORNADA
              <span class="arrow">→</span>
            </button>

          </div>

        </section>


        <section class="progress-card">

          <div class="progress-top">

            <span class="progress-label">
              Sua caminhada
            </span>

            <span class="progress-number">
              ${progress} / 365
            </span>

          </div>

          <div class="progress-track">

            <div
              class="progress-fill"
              style="width:${(progress / 365) * 100}%"
            ></div>

          </div>

        </section>


        <section class="section">

          <div class="section-kicker">
            HOJE
          </div>

          <h2 class="section-title">
            Um encontro para hoje.
          </h2>


          <article
            class="today-card"
            data-action="open-today"

  /* -------------------------------------------------------

  function renderJourneyCards() {

    const api =
      getAPI();

      api?.PHASES || [];

      {
        name: "Perceber",
        start: 1,
        end: 30,
        description:
          "Aprender a reconhecer a presença."
      },

      {
        name: "Aprofundar",
        start: 31,
        end: 60,
        description:
          "Ir além da superfície."
      },

      {
        name: "Ser Transformado",
        start: 61,
        end: 90,
        description:
          "Permitir que a presença transforme o interior."
      },

      {
        name: "Orar",
        start: 91,
        end: 120,
        description:
          "Aprender a conversar com O Eterno."
      },

      {
        name: "Ouvir",
        start: 121,
        end: 150,
        description:
          "Desenvolver silêncio, percepção e discernimento."
      },

      {
        name: "Palavra",
        start: 151,
        end: 180,
        description:
          "Aprender a permanecer nas Escrituras."
      },

      {
        name: "Jesus",
        start: 181,
        end: 220,
        description:
          "Reconhecer Cristo como centro da caminhada."
      },

      {
        name: "Direção",
        start: 221,
        end: 250,
        description:
          "Aprender a caminhar com discernimento."
      },

      {
        name: "Fruto",
        start: 251,
        end: 290,
        description:
          "Permitir que o interior apareça no exterior."
      },

      {
        name: "Servir",
        start: 291,
        end: 320,
        description:
          "Transformar presença em serviço."
      },

      {
        name: "Testemunhar",
        start: 321,
        end: 345,
        description:
          "Compartilhar aquilo que foi vivido."
      },

      {
        name: "Permanecer",
        start: 346,
        end: 365,
        description:
          "Continuar quando a jornada já virou vida."
      }

    ];


    const list =
      phases.length
        ? phases
        : fallback;


    return list.map(
      (phase, index) => {

        const start =
          phase.start ??
          phase.startDay ??
          1;

        const end =
          phase.end ??
          phase.endDay ??
          start + 29;

        const name =
          phase.name ??
          phase.title ??
          `Etapa ${index + 1}`;

        const description =
          phase.description ??
          phase.phaseDescription ??
          "";

        return `

          <article
            class="journey-card"
            data-action="phase"
            data-phase-index="${index}"
          >

            <img
              class="journey-image"
              src="${imageForDay(start)}"
              alt=""
            >

            <div class="journey-gradient"></div>

            <div class="journey-content">

              <div class="journey-number">
                ETAPA ${index + 1}
              </div>

              <h3>
                ${escapeHTML(name)}
              </h3>

              <p>
                ${start} — ${end}
              </p>

              <p>
                ${escapeHTML(description)}
              </p>

            </div>

          </article>

        `;

      }
    ).join("");
  }


  /* -------------------------------------------------------
     DEVOTIONAL
  ------------------------------------------------------- */

  function renderDevotional(dayOverride) {

    const api =
      getAPI();

    let day =
      dayOverride;

    if (
      !day &&
      api &&
      typeof api.getDevotional === "function"
    ) {

      day =
        api.getDevotional(
          getState().currentDay || 1
        );
    }

    if (!day) {

      day =
        getDay();
    }

    if (!day) {

      renderEmpty(
        "Devocional",
        "O conteúdo deste encontro ainda não foi carregado."
      );

      return;
    }


    currentDevotional =
      day;


    const number =
      day.day || 1;

    const title =
      day.title ||
      "Um encontro com O Eterno";


    const reference =
      day.reference ||
      day.bible ||
      "";


    const reflection =
      day.reflection ||
      day.introduction ||
      "";


    const study =
      day.study ||
      "";


    const application =
      day.application ||
      "";


    const practice =
      day.practice ||
      "";


    const silence =
      day.silence ||
      "";


    const prayer =
      day.prayer ||
      "";


    const journalQuestion =
      day.journalQuestion ||
      day.question ||
      "O que o Doce Espírito Santo está despertando em você hoje?";


    const state =
      getState();


    const journal =
      state.journal?.[number] ||
      "";


    const favorite =
      Array.isArray(state.favorites) &&
      state.favorites.includes(number);


    main.innerHTML = `

      <div class="view">

        <section class="devotional-hero">

          <img
            class="devotional-hero-image"
            src="${imageForDay(number)}"

          >

          <div class="devotional-hero-content">

            <div class="devotional-day">
              DIA ${escapeHTML(number)}
            </div>

            <h1 class="devotional-title">
              ${escapeHTML(title)}
            </h1>

            <div class="devotional-reference">
              ${escapeHTML(reference)}
            </div>

          </div>

        </section>


        <div class="study-stack">


          ${study
            ? `
              <section class="study-block">

                <div class="study-label">
                  ESTUDO

                <h3>
                  Aprofundando a Palavra
                </h3>

                <p>
                  ${formatText(study)}
                </p>

              </section>
            `
            : ""
          }


          ${reflection
            ? `
              <section class="study-block">

                <div class="study-label">
                  REFLEXÃO
                </div>

                <h3>
                  Percebendo a presença
                </h3>

                <p>
                  ${formatText(reflection)}
                </p>

              </section>
            `
            : ""
          }


          ${application
            ? `
              <section class="study-block">

                <div class="study-label">
                  VIVÊNCIA
                </div>

                <h3>
                  Levar a Palavra para a vida
                </h3>

                <p>
                  ${formatText(application)}
                </p>

              </section>
            `
            : ""
          }


          ${practice
            ? `
              <section class="study-block">

                <div class="study-label">
                  PRÁTICA ESPIRITUAL
                </div>

                <h3>
                  Hoje, pratique
                </h3>

                <p>
                  ${formatText(practice)}
                </p>

              </section>
            `
            : ""
          }


          ${silence
            ? `
              <section class="study-block">

                <div class="study-label">
                  MOMENTO DE SILÊNCIO
                </div>

                <h3>
                  Permaneça
                </h3>

                <p>
                  ${formatText(silence)}
                </p>

              </section>
            `
            : ""
          }


          ${prayer
            ? `
              <section class="study-block">

                <div class="study-label">
                  ORAÇÃO
                </div>

                <h3>
                  Converse com O Eterno
                </h3>

                <p>
                  ${formatText(prayer)}
                </p>

                <br>

                <button
                  class="primary-button"
                  data-action="audio"
                >
                  OUVIR ORAÇÃO
                  <span class="arrow">▶</span>
                </button>

              </section>
            `
            : ""
          }


          <section class="study-block">

            <div class="study-label">
              DIÁRIO
            </div>

            <h3>
              ${escapeHTML(journalQuestion)}
            </h3>

            <textarea
              class="journal"
              id="journalInput"
              placeholder="Escreva o que você percebeu..."
            >${escapeHTML(journal)}</textarea>

            <br><br>

            <button
              class="primary-button"
              data-action="save-journal"
            >
              SALVAR
              <span class="arrow">✓</span>
            </button>

          </section>


          <section class="study-block">

            <div class="study-label">
              CAMINHADA
            </div>

            <h3>
              Este encontro não termina aqui.

            <p>
              O objetivo não é apenas terminar um devocional.
              É aprender a viver com o

            <br>

            <button
              class="primary-button"
              data-action="complete-day"
            >
              ${isCompleted(number)
                ? "ENCONTRO CONCLUÍDO"
                : "CONCLUIR ENCONTRO"
              }
              <span class="arrow">→</span>
            </button>

          </section>

        </div>

      </div>

    `;
  }


  function formatText(text) {

    return escapeHTML(text)
      .replace(/\n/g, "<br>");
  }


  function isCompleted(day) {

    const state =
      getState();

    return Array.isArray(state.completedDays) &&
      state.completedDays.includes(
        Number(day)
      );
  }


  /* -------------------------------------------------------
     TODAY
  ------------------------------------------------------- */

  function renderToday() {

    renderDevotional(
      getDay()
    );
  }


  /* -------------------------------------------------------
     JOURNEY
  ------------------------------------------------------- */

  function renderJourney() {

    main.innerHTML = `

      <div class="view">

        <section class="section" style="margin-top:10px">

          <div class="section-kicker">

              presença, oração, jejum, Palavra e vivência.

              <strong>O Eterno</strong>, aprendendo a perceber
              o <strong>Doce Espírito Santo</strong> no cotidiano.

               style="flex-direction:column">

  /* -------------------------------------------------------
     FAVORITES
  ------------------------------------------------------- */

  function renderFavorites() {

    const state =
      getState();

    const favorites =
      Array.isArray(state.favorites)
        ? state.favorites
        : [];


    if (!favorites.length) {

      renderEmpty(
        "Seus favoritos",
        "Quando um encontro tocar você de maneira especial, ele aparecerá aqui."
      );

      return;
    }


    const cards =
      favorites.map(
        dayNumber => {

          const day =
            getAPI()?.getDevotional?.(
              dayNumber
            ) ||
            devotionals.find(
              item =>
                Number(item.day) === Number(dayNumber)
            );


          if (!day) {
            return "";
          }


          return `

            <article
              class="today-card"
              data-action="favorite-day"
              data-day="${dayNumber}"
            >

              <img
                class="today-image"
                src="${imageForDay(dayNumber)}"
                alt=""
              >

              <div class="today-overlay"></div>

              <div class="today-content">

                <div class="day-label">
                  DIA ${escapeHTML(dayNumber)}
                </div>

                <h3 class="today-title">
                  ${escapeHTML(day.title)}
                </h3>

                <div class="today-reference">
                  ${escapeHTML(day.reference || day.bible || "")}
                </div>

              </div>

            </article>

          `;

        }
      ).join("");


    main.innerHTML = `

      <div class="view">

        <section class="section"
                 style="margin-top:10px">

          <div class="section-kicker">
            FAVORITOS
          </div>

          <h1 class="section-title">
            O que ficou com você.
          </h1>

          <div class="study-stack">

            ${cards}

          </div>

        </section>

      </div>

    `;
  }


  /* -------------------------------------------------------
     PROFILE
  ------------------------------------------------------- */

  function renderProfile() {

    const progress =
      getProgress();


    main.innerHTML = `

      <div class="view">

        <section class="section"
                 style="margin-top:10px">

          <div class="section-kicker">
            PERFIL
          </div>

          <h1 class="section-title">
            Sua caminhada.
          </h1>


          <div class="profile-card">

            <h2 class="profile-name">
              Doce Espírito Santo
            </h2>

            <div class="profile-role">
              Um Amigo Íntimo
            </div>


            <div class="profile-divider"></div>


            <div class="profile-line">

              <span>
                Jornada
              </span>

              <strong>

              </strong>

            </div>

              <span>
                Encontros concluídos
              </span>

                ${progress}
              </strong>

            </div>

              <span>
                Tema central
              </span>

              <strong>
                Presença
              </strong>

            </div>

              </span>

              <strong>
                O Eterno
              </strong>

            </div>


            <div class="profile-divider"></div>


            <p style="
              color:var(--muted);
              line-height:1.7;

            ">

              Aprenda a percebê-lo.

          </div>

        </section>

      </div>

  /* -------------------------------------------------------
     EMPTY
  ------------------------------------------------------- */

  function renderEmpty(
    title,
    text
  ) {

    main.innerHTML = `

      <div class="view">

        <section class="section"
                 style="margin-top:10px">

          <div class="empty-state">

            <div class="empty-state-icon">
              ◌
            </div>

            <h3>
              ${escapeHTML(title)}
            </h3>

            <p>
              ${escapeHTML(text)}
            </p>

          </div>

        </section>

      </div>

    `;
  }


  /* -------------------------------------------------------
     ROUTER
  ------------------------------------------------------- */

  function navigate(route) {

    currentRoute =
      route;

    document
      .querySelectorAll(".nav-item")
      .forEach(
        button => {

          button.classList.toggle(
            "active",
            button.dataset.route === route
          );

        }
      );


    if (route === "home") {

      renderHome();

    } else if (route === "journey") {

      renderJourney();

    } else if (route === "today") {

      renderToday();

    } else if (route === "favorites") {

      renderFavorites();

    } else if (route === "profile") {

      renderProfile();

    }


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });
  }


  /* -------------------------------------------------------
     EVENTS
  ------------------------------------------------------- */

  document.addEventListener(
    "click",
    function (event) {

      const nav =
        event.target.closest(
          ".nav-item"
        );

      if (nav) {

        navigate(
          nav.dataset.route
        );

        return;
      }


      const action =
        event.target.closest(
          "[data-action]"
        );


      if (!action) {
        return;
      }


      const type =
        action.dataset.action;


      if (type === "continue") {

        renderToday();

        return;
      }


      if (type === "open-today") {

        renderToday();

        return;
      }


      if (type === "back") {

        navigate("home");

        return;
      }


      if (type === "feature") {

        const feature =
          action.dataset.feature;

        showToast(
          feature +
          " — conteúdo integrado à jornada."
        );

        return;
      }


      if (type === "phase") {

        const index =
          Number(
            action.dataset.phaseIndex
          );

        openPhase(
          index
        );

        return;
      }


      if (type === "favorite-day") {

        const day =
          Number(
            action.dataset.day
          );

        openSpecificDay(
          day
        );

        return;
      }


      if (type === "complete-day") {

        completeCurrentDay();

        return;
      }


      if (type === "save-journal") {

        saveJournal();

        return;
      }


      if (type === "audio") {

        playCurrentAudio();

        return;
      }

    }
  );


  /* -------------------------------------------------------
     OPEN DAY
  ------------------------------------------------------- */

  function openSpecificDay(day) {

    const api =
      getAPI();

    if (
      api &&
      typeof api.openDay === "function"
    ) {

      api.openDay(day);

    }

    currentDay =
      Number(day);

    renderDevotional(
      getDay()
    );
  }


  /* -------------------------------------------------------
     PHASE
  ------------------------------------------------------- */

  function openPhase(index) {

    const api =
      getAPI();

    const phases =
      api?.PHASES || [];

    const phase =
      phases[index];


    if (!phase) {

      showToast(
        "Etapa ainda não carregada."
      );

      return;
    }


    const start =
      phase.start ??
      phase.startDay ??
      1;


    openSpecificDay(
      start
    );
  }


  /* -------------------------------------------------------
     COMPLETE
  ------------------------------------------------------- */

  function completeCurrentDay() {

    const api =
      getAPI();

    const number =
      Number(
        currentDevotional?.day ||
        getState().currentDay ||
        1
      );


    if (
      api &&
      typeof api.completeDay === "function"
    ) {

      api.completeDay(
        number
      );

      showToast(
        "Encontro concluído. Continue caminhando com O Eterno."
      );

      renderDevotional(
        getDay()
      );

      return;
    }


    showToast(
      "Progresso salvo."
    );
  }


  /* -------------------------------------------------------
     JOURNAL
  ------------------------------------------------------- */

  function saveJournal() {

    const input =
      document.getElementById(
        "journalInput"
      );

    if (!input) {
      return;
    }


    const number =
      Number(
        currentDevotional?.day ||
        getState().currentDay ||
        1
      );


    const api =
      getAPI();


    if (
      api &&
      typeof api.saveJournal === "function"
    ) {

      api.saveJournal(
        number,
        input.value
      );

    } else {

      const state =
        getState();

      state.journal =
        state.journal || {};

      state.journal[number] =
        input.value;

    }


    showToast(
      "Seu registro foi guardado."
    );
  }


  /* -------------------------------------------------------
     AUDIO
  ------------------------------------------------------- */

  function playCurrentAudio() {

    const api =
      getAPI();

    if (
      api &&
      typeof api.playAudio === "function"
    ) {

      const result =
        api.playAudio(
          currentDevotional
        );

      if (result) {
        showToast(
          "Iniciando o áudio."
        );
      } else {
        showToast(
          "O áudio ainda não está disponível para este encontro."
        );
      }

      return;
    }


    if (
      "speechSynthesis" in window &&
      currentDevotional?.prayer
    ) {

      window.speechSynthesis.cancel();

      const utterance =
        new SpeechSynthesisUtterance(
          currentDevotional.prayer
        );

      utterance.lang =
        "pt-BR";

      utterance.rate =
        .88;

      utterance.pitch =
        .82;

      window.speechSynthesis.speak(
        utterance
      );

      showToast(
        "Oração iniciada."
      );

      return;
    }


    showToast(
      "Áudio indisponível."
    );
  }


  /* -------------------------------------------------------
     INFO
  ------------------------------------------------------- */

  document
    .getElementById("infoButton")
    .addEventListener(
      "click",
      function () {

        showToast(
          "Aprenda a percebê-lo. Ele já está aqui."
        );

      }
    );


  /* -------------------------------------------------------
     VIDEO FALLBACK
  ------------------------------------------------------- */

  if (backgroundVideo) {

    backgroundVideo.addEventListener(
      "error",
      function () {

        backgroundVideo.style.display =
          "none";

      }
    );

  }


  /* -------------------------------------------------------
     APP READY
  ------------------------------------------------------- */

  function boot() {

    try {

      const api =
        getAPI();


      if (api?.state?.currentDay) {

        currentDay =
          api.state.currentDay;

      }


      navigate(
        "home"
      );


      setTimeout(
        () => {

          loading.classList.add(
            "hidden"
          );

        },
        500
      );

    } catch (error) {

      console.error(
        "Erro ao iniciar aplicativo:",
        error
      );

      loading.classList.add(
        "hidden"
      );

      renderHome();
    }
  }


  /* -------------------------------------------------------
     WAIT FOR APP.JS
  ------------------------------------------------------- */

  if (
    getAPI() &&
    getAPI().state
  ) {

    boot();

  } else {

    window.addEventListener(
      "doceEspíritoSanto:ready",
      boot,
      { once: true }
    );


    setTimeout(
      () => {

        if (
          document
            .getElementById("loadingScreen")
            ?.classList
            .contains("hidden")
        ) {
          return;
        }

        boot();

      },
      1800
    );

  }


})();

</script>
