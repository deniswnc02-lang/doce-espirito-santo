<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24150d">

  <title>Doce Espírito Santo — Um Amigo Íntimo</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 75% 10%, rgba(255, 210, 130, 0.22), transparent 30%),
        linear-gradient(145deg, #120b07, #3b2112 48%, #120b07);
      color: #f8e6c5;
      min-height: 100vh;
      overflow-x: hidden;
    }

    .app {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* Atmosfera de luz */
    .light {
      position: absolute;
      width: 420px;
      height: 420px;
      top: -180px;
      right: -140px;
      background: radial-gradient(
        circle,
        rgba(255, 224, 160, 0.35),
        rgba(255, 200, 100, 0.08) 45%,
        transparent 70%
      );
      filter: blur(15px);
      pointer-events: none;
    }

    header {
      padding: 28px 22px 10px;
      text-align: center;
      position: relative;
      z-index: 2;
    }

    .brand-small {
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0.72;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px 22px 110px;
      position: relative;
      z-index: 2;
    }

    .home {
      width: 100%;
      max-width: 520px;
      text-align: center;
    }

    .symbol {
      width: 115px;
      height: 115px;
      margin: 20px auto 32px;
      border-radius: 50%;
      border: 1px solid rgba(244, 211, 154, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow:
        0 0 45px rgba(230, 176, 85, 0.14),
        inset 0 0 30px rgba(255, 210, 130, 0.05);
    }

    .feather {
      font-size: 58px;
      transform: rotate(-25deg);
      filter: drop-shadow(0 0 14px rgba(255, 210, 130, 0.5));
    }

    h1 {
      font-size: clamp(42px, 12vw, 72px);
      line-height: 0.92;
      font-weight: 400;
      letter-spacing: -2px;
      color: #f4d49f;
      text-shadow: 0 3px 25px rgba(0,0,0,0.4);
    }

    .subtitle {
      margin-top: 22px;
      font-size: 23px;
      font-style: italic;
      color: #efd09c;
      letter-spacing: 1px;
    }

    .manifesto {
      margin: 28px auto 0;
      max-width: 390px;
      font-size: 16px;
      line-height: 1.8;
      color: rgba(250, 231, 199, 0.78);
    }

    .start-button {
      margin-top: 35px;
      border: 1px solid rgba(244, 211, 154, 0.6);
      background: linear-gradient(
        135deg,
        rgba(177, 117, 46, 0.85),
        rgba(106, 62, 25, 0.9)
      );
      color: #fff0d2;
      padding: 16px 30px;
      border-radius: 50px;
      font-family: inherit;
      font-size: 15px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      box-shadow: 0 10px 35px rgba(0,0,0,0.3);
      transition: 0.3s ease;
    }

    .start-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 14px 40px rgba(190, 135, 61, 0.25);
    }

    .quote {
      margin-top: 38px;
      font-size: 14px;
      font-style: italic;
      opacity: 0.58;
    }

    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 76px;
      background: rgba(18, 11, 7, 0.94);
      backdrop-filter: blur(15px);
      border-top: 1px solid rgba(244, 211, 154, 0.12);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 10;
    }

    nav button {
      background: none;
      border: none;
      color: rgba(248, 230, 197, 0.6);
      font-family: inherit;
      font-size: 11px;
      cursor: pointer;
    }

    nav button span {
      display: block;
      font-size: 21px;
      margin-bottom: 4px;
    }

    .footer-mark {
      margin-top: 45px;
      font-size: 10px;
      letter-spacing: 1.5px;
      opacity: 0.45;
    }

    @media (max-width: 400px) {
      h1 {
        font-size: 43px;
      }

      .subtitle {
        font-size: 20px;
      }

      .manifesto {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="light"></div>

    <header>
      <div class="brand-small">
        365 dias de presença
      </div>
    </header>

    <main>

      <section class="home">

        <div class="symbol">
          <div class="feather">🪶</div>
        </div>

        <h1>
          Doce<br>
          Espírito<br>
          Santo
        </h1>

        <div class="subtitle">
          Um Amigo Íntimo
        </div>

        <p class="manifesto">
          365 dias não para aprender mais sobre
          o Espírito Santo, mas para aprender
          a perceber Sua presença.
        </p>

        <button class="start-button" onclick="startJourney()">
          Começar minha jornada
        </button>

        <div class="quote">
          “Permanecei em mim...”
        </div>

        <div class="footer-mark">
          UM PROJETO DE DENIS WILLIAN CRUZ
        </div>

      </section>

    </main>

    <nav>
      <button onclick="home()">
        <span>⌂</span>
        Início
      </button>

      <button onclick="journey()">
        <span>✦</span>
        Jornada
      </button>

      <button onclick="journal()">
        <span>✎</span>
        Diário
      </button>

      <button onclick="favorites()">
        <span>♡</span>
        Favoritos
      </button>

      <button onclick="profile()">
        <span>○</span>
        Perfil
      </button>
    </nav>

  </div>

  <script>
    function startJourney() {
      alert("Sua jornada começa aqui. 🪶");
    }

    function home() {
      alert("Início");
    }

    function journey() {
      alert("Jornada dos 365 dias");
    }

    function journal() {
      alert("Meu Diário");
    }

    function favorites() {
      alert("Meus Favoritos");
    }

    function profile() {
      alert("Meu Perfil");
    }
  </script>

</body>
</html>
