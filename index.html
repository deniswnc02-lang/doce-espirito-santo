<!doctype html>
<html lang="pt-BR">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<meta
  name="theme-color"
  content="#160d09"
>

<meta
  name="description"
  content="Doce Espírito Santo — Um Amigo Íntimo."
>

<link
  rel="manifest"
  href="manifest.json"
>

<link
  rel="icon"
  href="icon.svg"
>

<link
  rel="stylesheet"
  href="styles.css"
>

<title>
Doce Espírito Santo
</title>

</head>

<body>

<div id="app">

<header class="topbar">

<button
  class="icon-btn"
  id="menuBtn"
>
☰
</button>

<div class="brand">

<span class="brand-mark">
✦
</span>

<div>

<strong>
Doce Espírito Santo
</strong>

<small>
Um Amigo Íntimo
</small>

</div>

</div>

<button
  class="icon-btn"
  id="themeBtn"
>
☼
</button>

</header>


<main
  id="view"
  class="view"
>
</main>


<nav
  class="bottom-nav"
  aria-label="Navegação principal"
>

<button
  data-route="home"
  class="nav-item active"
>

<span>
⌂
</span>

<small>
Início
</small>

</button>


<button
  data-route="devotionals"
  class="nav-item"
>

<span>
▤
</span>

<small>
Devocionais
</small>

</button>


<button
  data-route="favorites"
  class="nav-item"
>

<span>
♡
</span>

<small>
Favoritos
</small>

</button>


<button
  data-route="profile"
  class="nav-item"
>

<span>
◉
</span>

<small>
Perfil
</small>

</button>

</nav>

</div>


<aside
  id="drawer"
  class="drawer"
>

<div class="drawer-head">

<div class="brand">

<span class="brand-mark">
✦
</span>

<div>

<strong>
Doce Espírito Santo
</strong>

<small>
Um Amigo Íntimo
</small>

</div>

</div>

<button
  class="icon-btn"
  id="closeDrawer"
>
×
</button>

</div>


<div class="drawer-content">

<button
  class="drawer-link"
  data-route="home"
>
⌂
<span>
Início
</span>
</button>


<button
  class="drawer-link"
  data-route="devotionals"
>
▤
<span>
Todos os devocionais
</span>
</button>


<button
  class="drawer-link"
  data-route="favorites"
>
♡
<span>
Meus favoritos
</span>
</button>


<button
  class="drawer-link"
  data-route="profile"
>
◉
<span>
Meu perfil
</span>
</button>


<hr>


<button
  class="drawer-link"
  id="resetBtn"
>
↻
<span>
Restaurar dados locais
</span>
</button>

</div>

</aside>


<div
  id="backdrop"
  class="backdrop"
>
</div>


<div
  id="toast"
  class="toast"
>
</div>


<script src="app.js"></script>

</body>

</html>
