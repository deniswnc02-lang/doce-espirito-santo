<svg width="800" height="800" viewBox="0 0 800 800" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <radialGradient id="bg" cx="0" cy="0" r="1"
    gradientUnits="userSpaceOnUse"
    gradientTransform="translate(430 300) rotate(120) scale(520)">
    <stop offset="0" stop-color="#DDA96A" stop-opacity=".38"/>
    <stop offset=".32" stop-color="#8D552C" stop-opacity=".20"/>
    <stop offset=".7" stop-color="#28170D" stop-opacity=".8"/>
    <stop offset="1" stop-color="#080706"/>
  </radialGradient>

  <radialGradient id="core" cx="0" cy="0" r="1"
    gradientUnits="userSpaceOnUse"
    gradientTransform="translate(430 300) scale(170)">
    <stop offset="0" stop-color="#FFF4DB" stop-opacity=".9"/>
    <stop offset=".18" stop-color="#E8BF84" stop-opacity=".45"/>
    <stop offset=".55" stop-color="#B6763B" stop-opacity=".12"/>
    <stop offset="1" stop-color="#B6763B" stop-opacity="0"/>
  </radialGradient>

  <linearGradient id="feather"
    x1="260" y1="120"
    x2="570" y2="670"
    gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#F7DEB2" stop-opacity=".72"/>
    <stop offset=".28" stop-color="#D19A5C" stop-opacity=".42"/>
    <stop offset=".65" stop-color="#77431F" stop-opacity=".18"/>
    <stop offset="1" stop-color="#2A160C" stop-opacity="0"/>
  </linearGradient>

  <linearGradient id="mist"
    x1="100" y1="500"
    x2="700" y2="500"
    gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#000" stop-opacity="0"/>
    <stop offset=".45" stop-color="#D7A56C" stop-opacity=".09"/>
    <stop offset=".7" stop-color="#E0B77D" stop-opacity=".12"/>
    <stop offset="1" stop-color="#000" stop-opacity="0"/>
  </linearGradient>

  <filter id="blur40">
    <feGaussianBlur stdDeviation="40"/>
  </filter>

  <filter id="blur18">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

</defs>


<!-- FUNDO -->

<rect width="800" height="800" fill="#080706"/>

<rect width="800" height="800" fill="url(#bg)"/>


<!-- ATMOSFERA -->

<ellipse
  cx="430"
  cy="330"
  rx="220"
  ry="260"
  fill="#B9783C"
  opacity=".10"
  filter="url(#blur40)"
/>


<ellipse
  cx="610"
  cy="560"
  rx="190"
  ry="160"
  fill="#9B5D2E"
  opacity=".08"
  filter="url(#blur40)"
/>


<!-- NÚCLEO -->

<circle
  cx="430"
  cy="300"
  r="180"
  fill="url(#core)"
/>


<circle
  cx="430"
  cy="300"
  r="5"
  fill="#FFF4DC"
  opacity=".9"
/>


<circle
  cx="430"
  cy="300"
  r="36"
  stroke="#F0CB91"
  stroke-opacity=".16"
  stroke-width="1"
/>


<circle
  cx="430"
  cy="300"
  r="78"
  stroke="#D69D5D"
  stroke-opacity=".08"
  stroke-width="1"
/>


<!-- PLUMA ABSTRATA -->

<path
  d="
    M435 105
    C520 160 570 245 575 330
    C580 445 520 555 390 675

    C438 575 455 485 440 405

    C424 316 375 230 322 158

    C360 132 397 115 435 105Z
  "
  fill="url(#feather)"
  opacity=".72"
  filter="url(#blur18)"
/>


<path
  d="
    M431 125
    C490 205 516 282 513 362
    C509 456 468 535 405 615
  "
  stroke="#F3D5A3"
  stroke-opacity=".20"
  stroke-width="3"
  stroke-linecap="round"
/>


<path
  d="
    M400 155
    C444 230 462 300 458 370
    C453 445 428 515 388 575
  "
  stroke="#D5A066"
  stroke-opacity=".13"
  stroke-width="2"
  stroke-linecap="round"
/>


<!-- PARTÍCULAS -->

<g fill="#F7DFC0">

  <circle cx="240" cy="220" r="2" opacity=".28"/>
  <circle cx="285" cy="150" r="1.5" opacity=".34"/>
  <circle cx="550" cy="190" r="2" opacity=".25"/>
  <circle cx="610" cy="270" r="1.5" opacity=".30"/>
  <circle cx="260" cy="410" r="1.5" opacity=".20"/>
  <circle cx="570" cy="450" r="2" opacity=".24"/>
  <circle cx="500" cy="570" r="1.5" opacity=".22"/>
  <circle cx="640" cy="520" r="1.5" opacity=".18"/>

</g>


<!-- NÉVOA -->

<path
  d="
    M0 540
    C180 470 350 475 520 530
    C640 568 730 590 800 625
    L800 800
    L0 800Z
  "
  fill="url(#mist)"
  filter="url(#blur18)"
/>


<!-- VINHETA -->

<rect
  width="800"
  height="800"
  fill="url(#bg)"
  opacity=".16"
/>

</svg>
